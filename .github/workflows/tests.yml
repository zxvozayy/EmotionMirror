name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Headless: the GUI stack (PyQt6, pynput, pygame) is not installed in CI.
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pandas scikit-learn
      - name: Byte-compile all sources
        run: python -m compileall -q . -x "(\.venv|venv)"
      - name: Run tests
        run: python -m pytest -v
